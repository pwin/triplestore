[package]
name = "holos-tabular"
description = "HOLOS — load CSV, TSV and dataframes into named graphs with a SPARQL CONSTRUCT mapping"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
holos-core.workspace = true
holos-store.workspace = true
holos-security.workspace = true
holos-engine.workspace = true
oxrdf.workspace = true
spargebra.workspace = true
spareval.workspace = true
thiserror.workspace = true
csv = "1"

# A DataFrame source, off by default. Polars is a large dependency tree and most callers
# want the CSV path; a caller who already has a DataFrame turns this on.
polars = { version = "0.55", optional = true, default-features = false }

[features]
default = []
polars = ["dep:polars"]
