[package]
name = "holos-bench"
description = "HOLOS — load and query timings across dataset sizes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "holos-bench"
path = "src/main.rs"

[dependencies]
holos-core.workspace = true
holos-store.workspace = true
holos-security.workspace = true
holos-engine.workspace = true
# The spatial benchmark builds probe geometries and compares against a scan, so it needs
# the geometry types and a set for de-duplicating shared terms.
geo.workspace = true
rustc-hash.workspace = true
holos-shacl.workspace = true
holos-holon.workspace = true
holos-stats.workspace = true
oxrdf.workspace = true
oxrdfio.workspace = true
spareval.workspace = true
anyhow.workspace = true

[features]
default = ["rocksdb"]
rocksdb = ["holos-store/rocksdb"]
