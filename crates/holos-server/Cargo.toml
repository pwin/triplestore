[package]
name = "holos-server"
description = "HOLOS L6 — SPARQL 1.2 Protocol over HTTP, with a YASGUI console"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "holos-server"
path = "src/main.rs"

[dependencies]
holos-core.workspace = true
holos-store.workspace = true
holos-security.workspace = true
holos-engine.workspace = true
holos-shacl.workspace = true
holos-stats.workspace = true
oxrdf.workspace = true
oxrdfio.workspace = true
sparesults.workspace = true
spareval.workspace = true
anyhow.workspace = true
fs4.workspace = true
# A small synchronous server. The store is single-writer/many-readers and its writes take
# `&mut`, so a thread-per-request model over an `RwLock` matches it exactly; an async
# runtime would buy nothing here but a much larger dependency tree.
tiny_http = "0.12"

[features]
default = ["rocksdb"]
rocksdb = ["holos-store/rocksdb"]
