[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "holosdb"
requires-python = ">=3.9"
description = "An RDF 1.2 triplestore with SPARQL 1.2 and access policy enforced at the index scan"
readme = "README.md"
license = { text = "MIT OR Apache-2.0" }
keywords = ["rdf", "sparql", "triplestore", "shacl", "geosparql", "semantic-web"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dynamic = ["version"]

[project.optional-dependencies]
# The published wheels already carry persistence, so this extra installs nothing. It exists
# so that `pip install holosdb[rocksdb]` is not an error for anyone who writes it expecting
# the usual convention, and so the intent is greppable in a requirements file.
#
# It cannot do the thing its name suggests: a Python extra selects *dependencies*, and
# RocksDB is compiled into the extension module rather than installed beside it. Splitting
# it into a second distribution would mean two PyO3 extension modules with mutually
# incompatible `Store` types. PACKAGING.md sets out what is done instead; call
# `holosdb.has_rocksdb()` to ask a wheel what it actually contains.
rocksdb = []

[project.urls]
Homepage = "https://github.com/pwin/triplestore"
Repository = "https://github.com/pwin/triplestore"
# `HEAD` rather than a branch name: GitHub resolves it to whatever the default branch
# is, so this survives the default being renamed. It was written as `main`, which this
# repository has never had, and the link 404d.
Documentation = "https://github.com/pwin/triplestore/blob/HEAD/crates/holos-python/README.md"
Changelog = "https://github.com/pwin/triplestore/releases"
Issues = "https://github.com/pwin/triplestore/issues"

[tool.maturin]
module-name = "holosdb._holosdb"
python-source = "python"
manifest-path = "Cargo.toml"
features = ["pyo3/extension-module"]
# abi3: one wheel per platform serves every CPython 3.9+, which matters when each wheel
# carries a statically linked RocksDB.
#
# `compatibility` is deliberately not pinned here. The right manylinux tag depends on the
# image a build runs in, and CI picks it per platform; pinning one in the manifest means a
# local build claims a compatibility it may not have. Release builds use manylinux_2_28,
# which is what bindgen's libclang requirement forces.
strip = true
