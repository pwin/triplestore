[package]
name = "holos-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "WebAssembly bindings for the HOLOS RDF 1.2 store and SPARQL 1.2 engine"

[lib]
# `cdylib` is what wasm-bindgen turns into the .wasm module; `rlib` keeps the crate
# buildable as an ordinary library, which is what lets `cargo build --workspace` and
# `cargo test --workspace` cover it on a native target too.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Default features, which means no RocksDB: `holos-store`'s `rocksdb` feature is opt-in and
# everything that could not cross to wasm -- tempfile, the scoped sort threads, the
# read-path clocks -- lives behind it. The in-memory store is the default backend, so this
# is the ordinary build rather than a special one.
holos-engine.workspace = true
holos-security.workspace = true
# For the SERVICE handler: spargebra to turn a pattern back into a query, sparesults to read
# the endpoint's SPARQL Results JSON. See src/service.rs.
spargebra.workspace = true
sparesults.workspace = true
oxiri = "0.2"
oxrdf.workspace = true
oxrdfio.workspace = true
spareval.workspace = true
js-sys = "0.3"
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
# Routes a Rust panic to console.error with its message and stack. Without it a panic
# surfaces in JS only as `RuntimeError: unreachable`, which says nothing about what failed.
console_error_panic_hook = "0.1"

# oxrdf mints blank node identifiers via `rand`, which reaches getrandom, and
# holos-engine seeds UUID() the same way. getrandom 0.3 has no default source on
# wasm32-unknown-unknown and needs both this feature *and* the
# `getrandom_backend="wasm_js"` cfg -- set for this target in the workspace
# .cargo/config.toml, because its own compile_error! says a feature alone is not enough.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
# SPARQL's NOW() reaches oxsdatatypes' clock, which is std::time::SystemTime by default and
# unimplemented on wasm32-unknown-unknown. oxsdatatypes provides for exactly this: its `js`
# feature switches the clock to js_sys::Date::now() for this target triple. Declared here so
# cargo's feature unification turns it on for the shared oxsdatatypes in wasm builds only;
# native builds keep SystemTime.
oxsdatatypes = { version = "0.2", features = ["js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

# Current rustc emits bulk-memory and sign-extension instructions by default, which the
# binaryen that wasm-pack downloads rejects unless told they are allowed -- it fails the
# build with "Bulk memory operations require bulk memory". Both proposals shipped years ago
# and are on by default in every runtime this targets (Node 16+, all current browsers), so
# enabling them is the right fix rather than turning wasm-opt off and shipping a bigger
# module.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-O', '--enable-bulk-memory', '--enable-sign-ext', '--enable-nontrapping-float-to-int']

[package.metadata.wasm-pack.profile.profiling]
wasm-opt = ['-O', '--enable-bulk-memory', '--enable-sign-ext', '--enable-nontrapping-float-to-int']
