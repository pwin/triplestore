[package]
name = "holos-engine"
description = "HOLOS L3 — SPARQL 1.2 evaluation over the HOLOS store, with policy enforced at the scan"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
holos-core.workspace = true
holos-store.workspace = true
holos-security.workspace = true
oxrdf.workspace = true
oxiri = "0.2"
oxrdfio.workspace = true
spargebra.workspace = true
spareval.workspace = true
sparopt.workspace = true
spargeo.workspace = true
holos-stats.workspace = true
flate2.workspace = true
geo.workspace = true
wkt.workspace = true
geojson.workspace = true
sparesults.workspace = true
thiserror.workspace = true
rustc-hash.workspace = true
rstar.workspace = true

[features]
default = []
# Lets the engine be tested over the persistent backend, which is the only one where a
# commit scope buffers and therefore the only one where the read overlay can be wrong.
rocksdb = ["holos-store/rocksdb"]

[dev-dependencies]
flate2.workspace = true
tempfile.workspace = true
