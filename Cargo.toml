[workspace]
resolver = "2"
members = [
    "crates/holos-core",
    "crates/holos-store",
    "crates/holos-security",
    "crates/holos-shacl",
    "crates/holos-shacl-engine",
    "crates/holos-holon",
    "crates/holos-stats",
    "crates/holos-engine",
    "crates/holos-cli",
    "crates/holos-server",
    "crates/holos-conformance",
    "crates/holos-python",
    "crates/holos-bench",
    "crates/holos-tabular",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pwin/new_triplestore_sparql_engine"
authors = ["HOLOS contributors"]

[workspace.dependencies]
# --- L0: reused wholesale from the Oxigraph project (MIT OR Apache-2.0).
# See DESIGN.md §4 — do not rewrite parsers, term models or result serialisers.
# RDF 1.2 / SPARQL 1.2 features are ON everywhere: triple terms are a v1 requirement
# (DESIGN.md §5), not an afterthought.
oxrdf = { version = "0.3", features = ["rdf-12", "oxsdatatypes", "rdfc-10"] }
oxrdfio = { version = "0.2", features = ["rdf-12"] }
oxsdatatypes = "0.2"
sparesults = { version = "0.3", features = ["sparql-12"] }
spargebra = { version = "0.4", features = ["sparql-12"] }
spareval = { version = "0.2", features = ["sparql-12"] }
# GeoSPARQL function library, from the Oxigraph family. Same reuse argument as the
# rest of L0: 43 conformance-heavy geometry functions nobody should rewrite.
spargeo = "0.5"
# Gzipped N-Triples and N-Quads are how large RDF is distributed; reading them is not
# optional for real datasets. Already in the tree via geojson, so no new supply chain.
flate2 = "1"
# geof:buffer and geof:boundary are not in spargeo; holos-engine implements them, and
# needs the same geometry stack spargeo itself uses so literals round-trip identically.
geo = "0.31"
wkt = "0.14"
geojson = "0.24"

# --- internal
holos-core = { path = "crates/holos-core", version = "0.0.1" }
holos-store = { path = "crates/holos-store", version = "0.0.1" }
holos-engine = { path = "crates/holos-engine", version = "0.0.1" }
holos-security = { path = "crates/holos-security", version = "0.0.1" }
holos-conformance = { path = "crates/holos-conformance", version = "0.0.1" }
holos-shacl = { path = "crates/holos-shacl", version = "0.0.1" }
holos-shacl-engine = { path = "crates/holos-shacl-engine", version = "0.0.1" }
holos-holon = { path = "crates/holos-holon", version = "0.0.1" }
holos-stats = { path = "crates/holos-stats", version = "0.0.1" }
holos-tabular = { path = "crates/holos-tabular", version = "0.0.1" }

# --- everything else
anyhow = "1"
thiserror = "2"
rustc-hash = "2"
rocksdb = { version = "0.24", default-features = false, features = ["lz4"] }
tempfile = "3"
proptest = "1"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
