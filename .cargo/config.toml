# getrandom 0.3 refuses to build for wasm32-unknown-unknown unless it is told which backend
# to use, and says so with a compile_error!. The `wasm_js` feature on the getrandom
# dependency (see crates/holos-wasm/Cargo.toml) is necessary but explicitly *not*
# sufficient -- this cfg is the other half. It reaches getrandom through `rand`, which oxrdf
# uses to mint blank node identifiers, and through holos-engine's own UUID() seed.
#
# Scoped to wasm32-unknown-unknown, so every native build -- the server, the CLI, the Python
# extension module, the test suite, the benches -- is completely unaffected.
[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="wasm_js"']
