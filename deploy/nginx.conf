# The front door, nginx flavour. See deploy/Caddyfile for the same thing in Caddy, which
# handles certificates for you.
#
# nginx passes unknown client headers through to the upstream unchanged. That means the
# X-Holos-* headers MUST each be set explicitly here — setting one overrides whatever the
# client sent. Omitting any of the three while --trust-forwarded-identity is on lets a
# caller inject that claim.

upstream holos {
    server 127.0.0.1:7878;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    server_name holos.example.com;

    ssl_certificate     /etc/ssl/certs/holos.crt;
    ssl_certificate_key /etc/ssl/private/holos.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # A SPARQL query arrives in a POST body and can be long.
    client_max_body_size 4m;

    # Queries can be slow. This is the real query timeout as far as clients are concerned;
    # the server has none of its own yet (see OPERATIONS.md, "What is missing").
    proxy_read_timeout 120s;

    location / {
        # Authenticate against whatever the enterprise already runs. The subrequest returns
        # 2xx with the resolved claims in its response headers, or 401.
        auth_request      /_auth;
        auth_request_set  $holos_principal $upstream_http_x_holos_principal;
        auth_request_set  $holos_roles     $upstream_http_x_holos_roles;
        auth_request_set  $holos_clearance $upstream_http_x_holos_clearance;

        # Set all three unconditionally. This is what stops a client injecting its own.
        proxy_set_header  X-Holos-Principal $holos_principal;
        proxy_set_header  X-Holos-Roles     $holos_roles;
        proxy_set_header  X-Holos-Clearance $holos_clearance;

        proxy_set_header  Host       $host;
        proxy_set_header  X-Real-IP  $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header  Connection "";

        proxy_pass http://holos;
    }

    location = /_auth {
        internal;
        proxy_pass              http://127.0.0.1:9000/verify;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
        proxy_set_header        X-Original-URI $request_uri;
    }

    # Health checks should not need to authenticate.
    location = /health {
        auth_request off;
        proxy_set_header X-Holos-Principal "";
        proxy_set_header X-Holos-Roles     "";
        proxy_set_header X-Holos-Clearance "";
        proxy_pass http://holos;
    }
}
