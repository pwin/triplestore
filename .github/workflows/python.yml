# Wheels for `holosdb`, and the release that publishes them.
#
# Publishing is by PyPI **trusted publishing** (OIDC): https://docs.pypi.org/trusted-publishers/
# That removes the long-lived API token from repository secrets entirely, which is the
# single highest-value change available for a package's supply chain.
#
# Two destinations, and they are configured separately:
#
# | Destination | Trigger | Environment | Where the publisher is configured |
# |---|---|---|---|
# | TestPyPI | manual run with `publish_testpypi` ticked | `testpypi` | test.pypi.org |
# | PyPI | pushing a `v*` tag | `pypi` | pypi.org |
#
# Each needs a trusted publisher naming this repository and **this file by name**
# (`python.yml`) and the environment below. Before a project's first upload it is registered
# as a *pending* publisher, which is what reserves the name; it becomes an ordinary one once
# something has been published. Until a publisher exists the corresponding job fails with a
# permissions error rather than falling back to anything.
name: python

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/python.yml"
  workflow_dispatch:
    inputs:
      publish_testpypi:
        description: "Also publish the built artefacts to TestPyPI"
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A wheel is a release artefact; build it like one even on a pull request, so what CI
  # exercises is what would ship.
  CARGO_PROFILE_RELEASE_DEBUG: "false"

jobs:
  # ---------------------------------------------------------------------------------
  # One wheel per platform. abi3 means each serves every CPython 3.9+, so the matrix is
  # over operating systems rather than over interpreter versions.
  # ---------------------------------------------------------------------------------
  wheels:
    name: wheel (${{ matrix.platform.os }} / ${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: ubuntu-latest, target: x86_64, manylinux: "2014" }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: "2014" }
          - { os: macos-13, target: x86_64, manylinux: "auto" }
          - { os: macos-latest, target: aarch64, manylinux: "auto" }
          - { os: windows-latest, target: x64, manylinux: "auto" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: >-
            --release
            --out dist
            --manifest-path crates/holos-python/Cargo.toml
          sccache: "true"
          # RocksDB is compiled from C++ and linked statically into the extension module,
          # so the build container needs a C++ toolchain and a good deal of patience. This
          # is the reason a wheel takes minutes rather than seconds.
          before-script-linux: |
            if command -v yum >/dev/null; then
              yum install -y gcc-c++ clang-devel
            elif command -v apt-get >/dev/null; then
              apt-get update && apt-get install -y g++ clang libclang-dev
            fi

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.os }}-${{ matrix.platform.target }}
          path: dist

  # ---------------------------------------------------------------------------------
  # The source distribution. PyPI wants one even when wheels cover every platform: it is
  # what lets an unlisted platform build from source, and what archives cite.
  # ---------------------------------------------------------------------------------
  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path crates/holos-python/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  # ---------------------------------------------------------------------------------
  # Install the built wheel into a clean interpreter and run the tests against it.
  #
  # Against the *wheel*, not the working tree: `maturin develop` would test a build that
  # nobody receives. This is the step that catches a packaging fault — a missing `.pyi`,
  # a module renamed in one place and not another — which a `cargo test` cannot see.
  # ---------------------------------------------------------------------------------
  test-wheel:
    name: test the wheel (${{ matrix.os }}, py${{ matrix.python }})
    needs: wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The oldest and newest interpreters the abi3 wheel claims to serve. If abi3 is
        # working, one wheel satisfies both; if it is not, this is where that shows up.
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Install and test
        shell: bash
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install --no-index --find-links dist --only-binary :all: holosdb
          python -c "import holosdb; print(holosdb.__version__, holosdb.has_rocksdb())"
          python -m pytest crates/holos-python/tests -v

  # ---------------------------------------------------------------------------------
  # TestPyPI: the rehearsal.
  #
  # Deliberately opt-in rather than automatic on every manual run — an upload cannot be
  # undone, and a version number cannot be reused even on TestPyPI. `skip-existing` keeps a
  # repeat run from failing the whole workflow when the version has already gone up, which
  # is what happens the second time anyone tries the pipeline without bumping.
  # ---------------------------------------------------------------------------------
  publish-testpypi:
    name: publish to TestPyPI
    if: github.event_name == 'workflow_dispatch' && inputs.publish_testpypi
    needs: [wheels, sdist, test-wheel]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/holosdb
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: What is about to be published
        run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  # ---------------------------------------------------------------------------------
  # Publish, on a tag only.
  # ---------------------------------------------------------------------------------
  publish:
    name: publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist, test-wheel]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/holosdb
    permissions:
      # Trusted publishing (OIDC). No API token in repository secrets — the single
      # highest-value thing available for a package's supply chain.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: What is about to be published
        run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1
